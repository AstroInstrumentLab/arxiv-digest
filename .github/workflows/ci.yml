name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: pip install requests pyyaml
      - name: Syntax check
        run: python -m py_compile src/*.py tests/*.py
      - name: Validate example config
        run: python -c "import yaml; d=yaml.safe_load(open('config.example.yaml',encoding='utf-8')); assert d['keywords']['source']"
      - name: Unit tests
        run: python tests/test_llm_chain.py